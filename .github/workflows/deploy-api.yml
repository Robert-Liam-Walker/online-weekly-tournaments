name: Deploy API

# Builds the Docker image, pushes it to ECR, and rolls it out to Elastic
# Beanstalk via S3 + create-application-version + update-environment.
#
# The whole pipeline skips cleanly (green check, "skipped" deploy job) until
# AWS credentials are configured, so forks and pre-AWS development never go
# red. Required configuration (see docs/DEPLOY.md):
#   Secrets:   AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY
#   Variables: AWS_REGION, ECR_REPOSITORY, EB_APPLICATION, EB_ENVIRONMENT
#              (all optional — defaults below)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-api
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.gate.outputs.deploy }}
    steps:
      # The secrets context is not available in job-level `if`, so surface
      # its presence through a step output instead.
      - name: Check for AWS credentials
        id: gate
        env:
          HAS_SECRETS: ${{ secrets.AWS_ACCESS_KEY_ID != '' && secrets.AWS_SECRET_ACCESS_KEY != '' }}
        run: |
          echo "deploy=${HAS_SECRETS}" >> "$GITHUB_OUTPUT"
          if [ "${HAS_SECRETS}" != "true" ]; then
            echo "::notice::AWS secrets not configured — skipping API deploy."
          fi

  deploy:
    needs: preflight
    if: needs.preflight.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    env:
      ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY || 'foxtrot-api' }}
      EB_APPLICATION: ${{ vars.EB_APPLICATION || 'foxtrot' }}
      EB_ENVIRONMENT: ${{ vars.EB_ENVIRONMENT || 'foxtrot-api-prod' }}
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr

      - name: Build and push image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            -t "${REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}" \
            -t "${REGISTRY}/${ECR_REPOSITORY}:latest" \
            .
          docker push "${REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"
          docker push "${REGISTRY}/${ECR_REPOSITORY}:latest"

      - name: Deploy to Elastic Beanstalk
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
          VERSION_LABEL: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          # Docker Compose source bundle (replaces the Dockerrun v1 bundle):
          # compose mode is the supported way to publish more than one port —
          # the UDP rendezvous registrar needs 41100/udp, which Dockerrun v1
          # cannot map. Two behavior changes vs Dockerrun, both deliberate:
          #   - EB does NOT run its managed nginx in compose mode, so the
          #     container publishes host port 80 itself (CloudFront's EB
          #     origin keeps hitting :80 unchanged).
          #   - EB writes the environment properties to a .env file in the
          #     app root; env_file picks them up (RENDEZVOUS_HOST/PORT etc.).
          # Rollback = redeploy a previous (Dockerrun) version label; EB
          # reconfigures per-bundle. Instance profile still needs
          # AmazonEC2ContainerRegistryReadOnly to pull the image.
          cat > docker-compose.yml <<EOF
          services:
            api:
              image: ${REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}
              ports:
                - "80:3001"
                - "41100:41100/udp"
              env_file: .env
              restart: unless-stopped
          EOF
          zip -r bundle.zip docker-compose.yml

          # EB's per-account/region artifacts bucket (creates it if missing).
          BUCKET=$(aws elasticbeanstalk create-storage-location \
            --query S3Bucket --output text)
          KEY="foxtrot-api/${VERSION_LABEL}.zip"
          aws s3 cp bundle.zip "s3://${BUCKET}/${KEY}"

          aws elasticbeanstalk create-application-version \
            --application-name "${EB_APPLICATION}" \
            --version-label "${VERSION_LABEL}" \
            --source-bundle "S3Bucket=${BUCKET},S3Key=${KEY}"

          aws elasticbeanstalk update-environment \
            --environment-name "${EB_ENVIRONMENT}" \
            --version-label "${VERSION_LABEL}"

      - name: Wait for environment to go green on the new version
        env:
          VERSION_LABEL: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          aws elasticbeanstalk wait environment-updated \
            --environment-names "${EB_ENVIRONMENT}"
          read -r HEALTH DEPLOYED <<< "$(aws elasticbeanstalk describe-environments \
            --environment-names "${EB_ENVIRONMENT}" \
            --query 'Environments[0].[Health,VersionLabel]' --output text)"
          echo "Environment health: ${HEALTH}, running version: ${DEPLOYED}"
          # Green alone is NOT success: a failed deploy rolls back to the
          # previous (healthy) version. Assert the env runs OUR version.
          test "${HEALTH}" = "Green"
          test "${DEPLOYED}" = "${VERSION_LABEL}"
